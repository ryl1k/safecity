[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safecity-ml"
version = "0.0.0"
description = "SafeCity ML / CV gRPC microservices (server-side)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/safecity_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
