name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pre-flight: which services changed?
  changes:
    uses: ./.github/workflows/changes.yml

  # web — build, check (types), tests, lint
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        # TODO: web has no ESLint config yet — non-blocking until one is added.
        continue-on-error: true
        run: pnpm --filter @safecity/web run lint
      - name: Check (types)
        run: pnpm --filter @safecity/web run type-check
      - name: Test
        run: pnpm --filter @safecity/web run test --if-present
      - name: Build
        run: pnpm --filter @safecity/web run build

  # api — tests, build, lint, check (types)
  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @safecity/api run lint
      - name: Check (types)
        run: pnpm --filter @safecity/api run type-check
      - name: Test
        run: pnpm --filter @safecity/api run test
      - name: Build
        run: pnpm --filter @safecity/api run build

  # mobile — tests + lint on CI (build happens on CD, main only)
  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @safecity/mobile run lint
      - name: Test
        run: pnpm --filter @safecity/mobile run test

  # ml — Python tests, lint, build
  ml:
    needs: changes
    if: ${{ needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" build
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
