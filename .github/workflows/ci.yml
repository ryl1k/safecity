name: CI

on:
  pull_request:
  push: # all branches — CI runs everywhere; CD (cd.yml) runs on main only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by the reusable changes.yml (paths-filter on PRs);
  # a called workflow can't request more than the caller grants, or the run
  # fails at startup (startup_failure).

jobs:
  # Pre-flight: which services changed?
  changes:
    uses: ./.github/workflows/changes.yml

  # web — build, check (types), tests, lint
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        # TODO: web has no ESLint config yet — non-blocking until one is added.
        continue-on-error: true
        run: pnpm --filter @safecity/web run lint
      - name: Check (types)
        run: pnpm --filter @safecity/web run type-check
      - name: Test
        run: pnpm --filter @safecity/web run test --if-present
      - name: Build
        # The build is a compile/prerender check — no real backend needed. These
        # placeholders satisfy the Supabase client constructor during prerender;
        # real values are injected per-deploy (Vercel/Docker build args).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: pnpm --filter @safecity/web run build

  # api — Go service (vet, lint, test, build). Guarded so CI stays green during the
  # TypeScript→Go transition: Go steps only run once apps/api/go.mod exists.
  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go module
        id: gomod
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api has no go.mod yet — Go CI activates once the Go service lands."
          fi
      - uses: actions/setup-go@v6
        if: steps.gomod.outputs.exists == 'true'
        with:
          go-version: stable
      - name: Verify modules
        if: steps.gomod.outputs.exists == 'true'
        run: go mod verify
      - name: Vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...
      - name: Lint (golangci-lint)
        if: steps.gomod.outputs.exists == 'true'
        # v9 → golangci-lint v2 (v1 binaries refuse a modern go module). v2 with
        # default linters; no config file needed.
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/api
      - name: Test
        if: steps.gomod.outputs.exists == 'true'
        run: go test -race ./...
      - name: Build
        if: steps.gomod.outputs.exists == 'true'
        run: go build ./...

  # mobile — tests + lint on CI (production EAS build happens on CD, main only)
  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @safecity/mobile run lint
      - name: Test
        run: pnpm --filter @safecity/mobile run test

  # ml — Python tests, lint, build
  ml:
    needs: changes
    if: ${{ needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/ml/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" build
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
