name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # the reusable changes.yml declares it; caller must grant it
  # too, or the run fails at startup (see ci.yml).

jobs:
  # Same pre-flight as CI: only deploy/package what changed.
  changes:
    uses: ./.github/workflows/changes.yml

  # mobile — production build (main only), via EAS
  mobile-build:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard EXPO_TOKEN
        id: guard
        run: echo "ready=${{ env.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Set up EAS
        if: steps.guard.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: EAS build
        if: steps.guard.outputs.ready == 'true'
        working-directory: apps/mobile
        run: eas build --platform all --profile production --non-interactive --no-wait
      - name: Skipped notice
        if: steps.guard.outputs.ready != 'true'
        run: echo "::notice::EXPO_TOKEN not set — EAS build wiring is in place but skipped."

  # docker — build & push images for changed deployable services to GHCR
  docker:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, ml]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        if: ${{ needs.changes.outputs[matrix.service] == 'true' }}
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: ${{ needs.changes.outputs[matrix.service] == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: ${{ needs.changes.outputs[matrix.service] == 'true' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safecity-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build & push
        if: ${{ needs.changes.outputs[matrix.service] == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
